spring:
  application:
    name: naroom-api
  config:
    import: optional:file:.env.local[.properties]
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    version: openapi_3_1

naroom:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
    issuer: naroom-api
    audience: naroom-app
  auth:
    google:
      allowed-audiences:
        - ${GOOGLE_OAUTH_IOS_CLIENT_ID:}
        - ${GOOGLE_OAUTH_ANDROID_CLIENT_ID:}
        - ${GOOGLE_OAUTH_WEB_CLIENT_ID:}
    apple:
      allowed-audiences:
        - ${APPLE_OAUTH_CLIENT_ID:}
  admin:
    # 이 이메일로 처음 로그인하면 AdminSuperAdminInvitationSeeder가 미리 만들어둔 초대를 통해 즉시
    # SUPER_ADMIN으로 전환된다(AdminLoginResolver). 값이 비어 있으면 아무것도 하지 않는다.
    super-admin-bootstrap-email: ${ADMIN_SUPER_ADMIN_BOOTSTRAP_EMAIL:}
    session:
      idle-timeout: ${ADMIN_SESSION_IDLE_TIMEOUT:30m}
      absolute-timeout: ${ADMIN_SESSION_ABSOLUTE_TIMEOUT:8h}
      cookie-name: ${ADMIN_SESSION_COOKIE_NAME:naroom_admin_session}
      cookie-domain: ${ADMIN_SESSION_COOKIE_DOMAIN:}
      frontend-redirect-uri: ${ADMIN_FRONTEND_REDIRECT_URI:}
    cors:
      # naroom-admin 로컬 개발 기본 포트(3000)를 기본값으로 둔다. 배포 환경은 ADMIN_CORS_ALLOWED_ORIGINS에
      # 콤마로 구분한 실제 origin(예: https://admin.naroom.xxx)을 넣는다 - 크리덴셜 포함 CORS는 와일드카드를 쓸 수 없다.
      allowed-origins: ${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    google-oauth:
      # 값이 없어도(로컬/CI) 문제 없이 뜨도록 플레이스홀더 기본값을 둔다 - 이 값 그대로는 실제 Google
      # 로그인이 될 리 없으니 안전하다. ADMIN_GOOGLE_OAUTH_CLIENT_ID를 실제로 설정하기 전까지는
      # /api/v1/admin/auth/login/google이 진짜 인증에 성공하지 않는다.
      client-id: ${ADMIN_GOOGLE_OAUTH_CLIENT_ID:unconfigured-admin-google-client-id}
      client-secret: ${ADMIN_GOOGLE_OAUTH_CLIENT_SECRET:unconfigured-admin-google-client-secret}
    preview:
      # Admin Web Implementation Spec §16.2: 15~30분 권장, 새로고침 시 재발급.
      token-timeout: ${ADMIN_PREVIEW_TOKEN_TIMEOUT:20m}
  preview:
    cors:
      # naroom-app Expo Web preview 빌드의 로컬 개발 기본 포트를 기본값으로 둔다.
      allowed-origins: ${PREVIEW_CORS_ALLOWED_ORIGINS:http://localhost:8081}
  ai:
    worker:
      enabled: ${AI_WORKER_ENABLED:false}
      batch-size: ${AI_WORKER_BATCH_SIZE:20}
      lease-timeout: ${AI_WORKER_LEASE_TIMEOUT:5m}
      poll-interval: ${AI_WORKER_POLL_INTERVAL:30s}
      executor:
        core-size: ${AI_WORKER_EXECUTOR_CORE_SIZE:4}
        max-size: ${AI_WORKER_EXECUTOR_MAX_SIZE:8}
        queue-capacity: ${AI_WORKER_EXECUTOR_QUEUE_CAPACITY:100}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
  push:
    token-encryption-key: ${PUSH_TOKEN_ENCRYPTION_KEY}
  notification:
    dispatch:
      enabled: ${NOTIFICATION_DISPATCH_ENABLED:false}
      poll-interval: ${NOTIFICATION_DISPATCH_POLL_INTERVAL:5m}