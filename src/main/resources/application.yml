spring:
  application:
    name: naroom-api
  config:
    import: optional:file:.env.local[.properties]
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    version: openapi_3_1

naroom:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
    issuer: naroom-api
    audience: naroom-app
  ai:
    worker:
      enabled: ${AI_WORKER_ENABLED:false}
      batch-size: ${AI_WORKER_BATCH_SIZE:20}
      lease-timeout: ${AI_WORKER_LEASE_TIMEOUT:5m}
      poll-interval: ${AI_WORKER_POLL_INTERVAL:30s}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}